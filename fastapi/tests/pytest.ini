[pytest]
# Pytest Configuration for Traffic Violation System Tests
# =========================================================

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Console output options
console_output_style = progress
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = pytest_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Test execution order - run tests in specific order
testpaths = tests/api

# Markers for test organization
markers =
    order1: Authentication tests (run first)
    order2: User management tests
    order3: Camera tests
    order4: Violation rules tests
    order5: Vehicle tests
    order6: Driving license tests
    order7: Violation tests
    order8: Officer operation tests
    order9: Citizen portal tests
    order10: Complaint tests
    order11: Denunciation tests
    order12: Payment tests
    order13: Notification tests
    order14: Activity tests
    order15: Statistics tests
    order16: Camera video tests
    smoke: Smoke tests
    integration: Integration tests
    unit: Unit tests

# Minimum Python version
minversion = 3.8

# Coverage options (if pytest-cov is installed)
# [tool:pytest]
# coverage options can be added here
